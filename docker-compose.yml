services:
  postgis:
    image: postgis/postgis:16-3.5
    container_name: aigis-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigis}
      POSTGRES_USER: ${POSTGRES_USER:-aigis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigis_dev_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aigis} -d ${POSTGRES_DB:-aigis}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgis_data:

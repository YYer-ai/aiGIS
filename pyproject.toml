[project]
name = "aigis"
version = "0.1.0"
description = "AI-GIS：中文自然语言空间查询 + GeoAI Agent 对话平台"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "typer>=0.12",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]

[project.scripts]
aigis = "aigis.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigis"]

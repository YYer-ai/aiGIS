  human_pass: true
- id: 49
  question: 离王府井最近的十个便利店
  category: 最近邻
  expected_semantics: 锚点 name LIKE '%王府井%' ORDER BY ST_Distance osm_pois(shop=convenience) LIMIT 10
  expect_rows_range: [1, 10]
  human_pass: true
- id: 50
  question: 离国贸最近的三个咖啡馆
  category: 最近邻
